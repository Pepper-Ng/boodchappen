<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Boodschappen account setup</title>
  <desc id="desc">Landing page mockup with auth panel and product value cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6efe2"/>
      <stop offset="100%" stop-color="#dfe8e4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12756c"/>
      <stop offset="100%" stop-color="#b96f2a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#10212f" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1320" cy="150" r="180" fill="#12756c" fill-opacity="0.10"/>
  <circle cx="190" cy="860" r="220" fill="#b96f2a" fill-opacity="0.11"/>
  <g filter="url(#shadow)">
    <rect x="80" y="90" width="930" height="790" rx="42" fill="#ffffff" fill-opacity="0.82"/>
    <rect x="1040" y="130" width="480" height="670" rx="42" fill="#ffffff" fill-opacity="0.9"/>
  </g>
  <rect x="126" y="136" width="66" height="66" rx="22" fill="url(#accent)"/>
  <rect x="230" y="150" width="240" height="22" rx="11" fill="#173045" fill-opacity="0.30"/>
  <rect x="230" y="184" width="170" height="14" rx="7" fill="#173045" fill-opacity="0.16"/>
  <rect x="126" y="248" width="280" height="26" rx="13" fill="#12756c" fill-opacity="0.12"/>
  <rect x="126" y="296" width="600" height="86" rx="26" fill="#f4efe7"/>
  <rect x="126" y="404" width="600" height="86" rx="26" fill="#eef5f2"/>
  <rect x="126" y="512" width="600" height="86" rx="26" fill="#f6f1e8"/>
  <rect x="126" y="620" width="600" height="86" rx="26" fill="#eef4f3"/>
  <rect x="126" y="748" width="180" height="58" rx="29" fill="#12756c"/>
  <rect x="330" y="748" width="180" height="58" rx="29" fill="#e8f1ed"/>
  <rect x="1056" y="160" width="180" height="20" rx="10" fill="#12756c" fill-opacity="0.12"/>
  <rect x="1056" y="206" width="250" height="24" rx="12" fill="#173045" fill-opacity="0.26"/>
  <rect x="1056" y="252" width="298" height="50" rx="20" fill="#f6f0e7"/>
  <rect x="1056" y="320" width="298" height="50" rx="20" fill="#eef5f2"/>
  <rect x="1056" y="388" width="298" height="50" rx="20" fill="#f5efe6"/>
  <rect x="1056" y="486" width="298" height="220" rx="28" fill="#10212f" fill-opacity="0.05"/>
  <text x="126" y="212" fill="#10212f" font-size="30" font-family="Georgia, serif" font-weight="700">One flow for groceries</text>
  <text x="126" y="266" fill="#5d6875" font-size="18" font-family="Trebuchet MS, sans-serif">Import AH products, connect Allerhande recipes, and keep planning visible.</text>
  <text x="1080" y="202" fill="#10212f" font-size="24" font-family="Georgia, serif" font-weight="700">Sign in</text>
  <text x="1080" y="236" fill="#5d6875" font-size="15" font-family="Trebuchet MS, sans-serif">Username or email + password</text>
  <text x="1080" y="288" fill="#10212f" font-size="17" font-family="Trebuchet MS, sans-serif">Email</text>
  <text x="1080" y="356" fill="#10212f" font-size="17" font-family="Trebuchet MS, sans-serif">Password</text>
  <text x="1080" y="530" fill="#10212f" font-size="18" font-family="Trebuchet MS, sans-serif">Three principles</text>
  <text x="1080" y="576" fill="#5d6875" font-size="16" font-family="Trebuchet MS, sans-serif">Import</text>
  <text x="1160" y="576" fill="#5d6875" font-size="16" font-family="Trebuchet MS, sans-serif">Plan</text>
  <text x="1235" y="576" fill="#5d6875" font-size="16" font-family="Trebuchet MS, sans-serif">Export</text>
  <text x="1180" y="776" fill="#12756c" font-size="22" font-family="Trebuchet MS, sans-serif" font-weight="700">Boodschappen</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Boodschappen shopping list export</title>
  <desc id="desc">Shopping list panel with export lines and matched products.</desc>

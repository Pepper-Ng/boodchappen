<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Boodschappen import jobs</title>
  <desc id="desc">Import job timeline with queued, running, and succeeded states.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff5f3"/>
      <stop offset="100%" stop-color="#f5efe4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#10212f" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="116" y="108" width="1368" height="784" rx="46" fill="#ffffff" fill-opacity="0.86"/>
  </g>
  <rect x="168" y="164" width="210" height="24" rx="12" fill="#12756c" fill-opacity="0.12"/>
  <rect x="168" y="214" width="520" height="26" rx="13" fill="#173045" fill-opacity="0.22"/>
  <rect x="220" y="336" width="70" height="70" rx="24" fill="#12756c" fill-opacity="0.18"/>
  <rect x="220" y="486" width="70" height="70" rx="24" fill="#b96f2a" fill-opacity="0.18"/>
  <rect x="220" y="636" width="70" height="70" rx="24" fill="#12756c" fill-opacity="0.18"/>
  <rect x="344" y="356" width="1040" height="32" rx="16" fill="#eef4f7"/>
  <rect x="344" y="506" width="1040" height="32" rx="16" fill="#f7f0e8"/>
  <rect x="344" y="656" width="1040" height="32" rx="16" fill="#eef6f3"/>
  <circle cx="255" cy="371" r="14" fill="#12756c"/>
  <circle cx="255" cy="521" r="14" fill="#b96f2a"/>
  <circle cx="255" cy="671" r="14" fill="#12756c"/>
  <rect x="344" y="280" width="220" height="18" rx="9" fill="#173045" fill-opacity="0.18"/>

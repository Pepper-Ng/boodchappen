  <rect x="976" y="220" width="150" height="18" rx="9" fill="#12756c" fill-opacity="0.16"/>
  <rect x="976" y="258" width="300" height="24" rx="12" fill="#173045" fill-opacity="0.24"/>
  <rect x="976" y="308" width="270" height="18" rx="9" fill="#173045" fill-opacity="0.12"/>
  <rect x="976" y="344" width="250" height="18" rx="9" fill="#173045" fill-opacity="0.10"/>

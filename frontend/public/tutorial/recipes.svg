<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Boodschappen recipe import</title>
  <desc id="desc">Recipe import progress card and parsed recipe details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6f3"/>
      <stop offset="100%" stop-color="#f6efe2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12756c"/>
      <stop offset="100%" stop-color="#65d7ca"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#10212f" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="120" y="110" width="1360" height="780" rx="42" fill="#ffffff" fill-opacity="0.86"/>

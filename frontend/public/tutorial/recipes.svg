  <rect x="176" y="264" width="700" height="18" rx="9" fill="#173045" fill-opacity="0.12"/>
  <rect x="176" y="302" width="700" height="18" rx="9" fill="#173045" fill-opacity="0.10"/>
  <rect x="176" y="340" width="700" height="18" rx="9" fill="#173045" fill-opacity="0.08"/>
  <rect x="176" y="410" width="650" height="130" rx="30" fill="#eff6f3"/>

  <text x="1020" y="486" fill="#10212f" font-size="19" font-family="Trebuchet MS, sans-serif" font-weight="700">Recipe URL</text>
  <text x="1018" y="572" fill="#ffffff" font-size="18" font-family="Trebuchet MS, sans-serif" font-weight="700">Open job details</text>

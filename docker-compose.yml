services:
  backend:
    build: ./backend
    expose: ["8000"]
    environment:
      - DATABASE_URL=sqlite:///./app.db
      - SECRET_KEY=change-me
    networks: [proxy]
  frontend:
    build: ./frontend
    expose: ["5173"]
    ports: ["5173:5173"]
    depends_on: [backend]
    networks: [proxy]

networks:
  proxy:
    external: true

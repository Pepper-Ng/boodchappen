name: boodchappen-test

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: boodschappen_test
      POSTGRES_USER: boodschappen_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Set TEST_POSTGRES_PASSWORD in your shell or env file}
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boodschappen_test -d boodschappen_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://boodschappen_test:${TEST_POSTGRES_PASSWORD:?Set TEST_POSTGRES_PASSWORD in your shell or env file}@db:5432/boodschappen_test
      SECRET_KEY: ${TEST_SECRET_KEY:?Set TEST_SECRET_KEY to a strong value in your shell or env file}
      ACCESS_TOKEN_EXPIRES_MINUTES: ${TEST_ACCESS_TOKEN_EXPIRES_MINUTES:-60}
      CORS_ORIGINS: ${TEST_CORS_ORIGINS:-}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${TEST_VITE_API_BASE_URL:-}
    ports:
      - "5174:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_test_data: